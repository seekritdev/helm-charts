{{- include "seekrit-wasmcloud.validate" . -}}
{{- if or (not .Values.existingSecret) .Values.backend.xkeySeed (and .Values.otel.headers (not .Values.otel.existingSecret)) }}
{{- /* Build the profile document first, so the block below stays plain YAML.
       Every token in the release lives in this Secret and nowhere else — it is
       mounted 0400 into the backend, and no workload can reach it. */}}
{{- $profiles := dict }}
{{- range $name, $p := .Values.profiles }}
  {{- $entry := dict "token" $p.token }}
  {{- with (or $p.apiUrl $p.api_url) }}{{- $_ := set $entry "api_url" . }}{{- end }}
  {{- with $p.issuers }}{{- $_ := set $entry "issuers" . }}{{- end }}
  {{- with $p.entities }}{{- $_ := set $entry "entities" . }}{{- end }}
  {{- with $p.applications }}{{- $_ := set $entry "applications" . }}{{- end }}
  {{- $_ := set $profiles $name $entry }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "seekrit-wasmcloud.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seekrit-wasmcloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.existingSecret }}
  wasmcloud.json: {{ dict "profiles" $profiles | toJson | quote }}
  {{- end }}
  {{- with .Values.backend.xkeySeed }}
  xkeySeed: {{ . | quote }}
  {{- end }}
  {{- if and .Values.otel.headers (not .Values.otel.existingSecret) }}
  otelHeaders: {{ .Values.otel.headers | quote }}
  {{- end }}
{{- end }}
