apiVersion: v1
kind: Service
metadata:
  name: {{ include "seekrit-eso.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seekrit-eso.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "seekrit-eso.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
