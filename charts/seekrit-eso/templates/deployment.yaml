apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seekrit-eso.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seekrit-eso.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "seekrit-eso.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /* Roll pods when the token / api key changes. */}}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "seekrit-eso.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "seekrit-eso.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: seekrit-sdk-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --listen
            - "0.0.0.0:{{ .Values.service.port }}"
            - --refresh-interval
            - {{ .Values.refreshInterval | quote }}
          env:
            - name: SEEKRIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "seekrit-eso.tokenSecretName" . }}
                  key: {{ include "seekrit-eso.tokenSecretKey" . }}
            - name: SEEKRIT_SDK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "seekrit-eso.fullname" . }}
                  key: sidecarApiKey
            - name: SEEKRIT_API_URL
              value: {{ .Values.seekrit.apiUrl | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
