{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "seekrit-eso.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seekrit-eso.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "seekrit-eso.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
