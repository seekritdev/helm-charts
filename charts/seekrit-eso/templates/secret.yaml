{{- /*
Chart-managed Secret. Always holds the sidecar API key (referenced by both the
Deployment and the SecretStore's webhook config). Also holds the seekrit token
unless you brought your own via seekrit.existingSecret.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "seekrit-eso.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seekrit-eso.labels" . | nindent 4 }}
type: Opaque
stringData:
  sidecarApiKey: {{ include "seekrit-eso.apiKey" . | quote }}
  {{- if not .Values.seekrit.existingSecret }}
  token: {{ required "seekrit.token is required (or set seekrit.existingSecret). Mint one with: seekrit token create --name eso --app <app> --env <env>" .Values.seekrit.token | quote }}
  {{- end }}
