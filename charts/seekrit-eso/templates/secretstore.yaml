{{- if .Values.secretStore.create }}
{{- /*
The webhook provider points ESO at the sidecar Service. The `{{ .remoteRef.key }}`
and `{{ .apikey.sidecarApiKey }}` below are ESO's OWN templating, evaluated at
sync time — the backtick-quoting keeps Helm from touching them. Each GetSecret
becomes:  GET http://<svc>/v1/secret/<remoteRef.key>  with the sidecar API key as
a bearer header, and ESO reads the value at `$.value`.
*/ -}}
apiVersion: external-secrets.io/v1
kind: {{ .Values.secretStore.kind }}
metadata:
  name: {{ .Values.secretStore.name }}
  {{- if eq .Values.secretStore.kind "SecretStore" }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "seekrit-eso.labels" . | nindent 4 }}
spec:
  provider:
    webhook:
      url: "http://{{ include "seekrit-eso.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}/v1/secret/{{ `{{ .remoteRef.key }}` }}"
      method: GET
      result:
        jsonPath: "$.value"
      headers:
        Authorization: "Bearer {{ `{{ .apikey.sidecarApiKey }}` }}"
      secrets:
        - name: apikey
          secretRef:
            name: {{ include "seekrit-eso.fullname" . }}
            key: sidecarApiKey
            {{- if eq .Values.secretStore.kind "ClusterSecretStore" }}
            namespace: {{ .Release.Namespace }}
            {{- end }}
{{- end }}
