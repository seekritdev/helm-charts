apiVersion: v2
name: seekrit-eso
description: >-
  Sync seekrit secrets into Kubernetes via the External Secrets Operator.
  Deploys the seekrit-sdk-server sidecar (holds a service token, decrypts
  locally, serves plaintext over an authed HTTP API) and generates a webhook
  SecretStore so you only write ExternalSecret resources. Runs on stock,
  unmodified ESO.
type: application
# Both fields are bumped by release-please, never by hand — see
# release-please-config.json:
#   - `version` bumps whenever a Conventional Commit touches
#     charts/seekrit-eso/** (the "charts/seekrit-eso" package, release-type
#     "helm" — it owns this field plus a chart-scoped CHANGELOG.md).
#   - `appVersion` tracks the seekrit-sdk-server release, via that package's
#     `extra-files` entry (type "yaml", jsonpath $.appVersion) — it bumps
#     whenever sdk-server cuts a release, independent of chart changes.
#
# Both were corrected by hand once, on 2026-09-14, because the `extra-files`
# entry addressed a path relative to the *app* package and so had never run —
# the rule above held, but nothing was enforcing it. `version` had to move in
# the same commit: publish-chart.yml fires on any Chart.yaml change, and
# republishing an unchanged `version` rewrites an already-published OCI tag
# while charts.seekrit.dev skips it, leaving the two serving different bytes.
# .github/scripts/check-release-wiring.mjs now fails CI on either drift.
version: 0.6.1
appVersion: "0.7.2"
keywords:
  - seekrit
  - secrets
  - external-secrets
  - eso
home: https://seekrit.dev
sources:
  - https://github.com/seekritdev/helm-charts
  - https://github.com/seekritdev/seekrit-sdk-server
maintainers:
  - name: seekrit
    url: https://seekrit.dev
annotations:
  # External Secrets Operator must be installed in the cluster first; this chart
  # does not bundle it (so it never collides with an existing ESO install).
  external-secrets.io/required: ">=0.9.0"
