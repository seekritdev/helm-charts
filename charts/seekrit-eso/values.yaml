# Default values for seekrit-eso.
#
# Minimal drop-in: set `seekrit.token` (a service token bound to one app
# environment) and install. Everything else has sane defaults.

seekrit:
  # A seekrit service token (skt_…) bound to the app environment you want to
  # sync. Mint with:  seekrit token create --name eso --app <app> --env <env>
  # Leave empty and set `existingSecret` instead to manage the token yourself
  # (GitOps / sealed-secrets / SOPS).
  token: ""

  # Bring-your-own Secret holding the token. When set, `seekrit.token` is
  # ignored and the token is read from this Secret.
  existingSecret: ""
  # Key within `existingSecret` that holds the token.
  existingSecretTokenKey: token

  # seekrit API base URL. Only change for self-hosted / staging.
  apiUrl: https://api.seekrit.dev

# How often the sidecar re-resolves from seekrit (picks up rotations/new secrets).
# Accepts 30s, 5m, 1h, or a bare seconds count. ESO's own ExternalSecret
# refreshInterval polls the sidecar on top of this.
refreshInterval: 60s

# OpenTelemetry export from the sidecar to YOUR collector (never to seekrit).
# Leave `endpoint` empty — the default — and nothing is exported: no exporters
# are created and no connections attempted.
#
# Spans and metrics carry secret *names*, counts, and outcomes; never values.
# See https://seekrit.dev/docs/guides/telemetry
otel:
  # OTLP/HTTP base endpoint, e.g. http://otel-collector.observability:4318.
  # The signal paths (/v1/traces, /v1/metrics, /v1/logs) are appended for you.
  endpoint: ""
  # Overrides the reported service.name. Defaults to seekrit-sdk-server.
  serviceName: ""
  # Extra OTEL resource attributes, comma-separated,
  # e.g. "deployment.environment=prod,service.namespace=platform".
  resourceAttributes: ""
  # Collector credentials as OTEL_EXPORTER_OTLP_HEADERS, e.g. "api-key=abc123".
  # This is a credential: prefer `existingSecret` below over an inline value.
  headers: ""
  # Bring-your-own Secret holding the headers string. When set, `headers` is
  # ignored and the value is read from this Secret.
  existingSecret: ""
  existingSecretHeadersKey: otelHeaders
# Opt-in last-known-good cache.
#
# The sidecar's first resolve is fail-closed: if the seekrit API is unreachable
# at startup it will not bind, so a pod rescheduled during an outage takes every
# ExternalSecret it backs down with it. Turn this on and it keeps the *encrypted*
# resolve response on a volume and starts from that instead, then keeps retrying
# and switches to live secrets as soon as the API answers.
#
# Decrypting the cached copy still requires the service token, so the volume is
# no more sensitive than the token Secret already mounted into the pod. Two
# trade-offs to know: a revoked token keeps working until `maxAge` elapses (a
# *refused* resolve deletes the entry, so this only applies while the API is
# unreachable), and a cached start does not produce the `env.resolve_denied`
# audit row that a live rejected resolve would.
cache:
  enabled: false
  # How stale the cached copy may be and still be used at startup.
  maxAge: 24h
  # Where the volume is mounted inside the container.
  mountPath: /var/cache/seekrit
  # The volume itself. Empty means `emptyDir: {}`, which survives a container
  # restart but NOT a reschedule onto another node — one of the cases this
  # exists for. For that, point it at a PVC:
  #   volume:
  #     persistentVolumeClaim:
  #       claimName: seekrit-lkg-cache
  # The container runs as uid 65532; a PVC usually needs a matching
  # `podSecurityContext.fsGroup` for it to be writable.
  volume: {}

sidecar:
  # Bearer key ESO must present to the sidecar's /v1/secret* endpoints. Leave
  # empty to auto-generate a 32-char key on first install (preserved across
  # `helm upgrade`). The sidecar decrypts everything the token can reach, so this
  # key — plus network reachability — is what stops other in-cluster workloads
  # reading your secrets.
  apiKey: ""

# The SecretStore (or ClusterSecretStore) this chart generates. Your
# ExternalSecrets reference it by `secretStoreRef.name`.
secretStore:
  create: true
  # "SecretStore" (namespaced, default) or "ClusterSecretStore" (cluster-wide).
  kind: SecretStore
  name: seekrit

image:
  # Published to both registries, same bytes. Prefer ghcr.io on a cluster of any
  # size: Docker Hub rate-limits anonymous pulls per IP, and every node behind
  # one NAT egress shares that budget — which surfaces as ImagePullBackOff at
  # the worst possible moment, not as a registry error you would think to look
  # for.  ghcr.io/seekritdev/sdk-server
  repository: seekritdev/sdk-server
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

service:
  port: 8080

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Optional: restrict who may reach the sidecar to the External Secrets Operator
# pods. Default off — enabling it without matching your ESO install's namespace/
# labels will break syncs. When on, ingress is allowed only from `from`.
networkPolicy:
  enabled: false
  # e.g. [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: external-secrets } } }]
  from: []

podAnnotations: {}
podLabels: {}

# The image is a single static binary on `scratch`, so it locks down cleanly.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
